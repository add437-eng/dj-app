<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Springboard</title>
<script src="../analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --panel:#141417; --panel2:#1b1b20; --line:#2b2b32; --ink:#efe8db; --muted:#a39c90;
  --accent:#a77bff; --warn:#ffb000; --teal:#35d6c6; --green:#3ddc84; --red:#ff5a4f;
  --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
a{color:var(--accent)}
h1,h2,h3,.brand{font-family:Righteous,"DM Sans",sans-serif;font-weight:400;letter-spacing:.02em;margin:0}
.lcd{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.06em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14002e}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem}
input,select,textarea{background:#0e0e11;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
.muted{color:var(--muted)} .note{color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);background-image:var(--brush);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#555,#1a1a1a)}
.panel::before{left:8px}.panel::after{right:8px}

/* top bar */
.deck{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(#18181c,#0f0f12);border-bottom:1px solid var(--line)}
.brand{font-size:1.5rem;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.burger{background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:40px;display:grid;place-items:center}
.burger span{display:block;width:20px;height:2px;background:var(--ink);box-shadow:0 6px 0 var(--ink),0 -6px 0 var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.side{position:fixed;top:0;right:0;height:100%;width:min(300px,86vw);background:var(--panel);background-image:var(--brush);border-left:1px solid var(--line);z-index:31;padding:20px;transform:translateX(100%);transition:transform .25s}
.side.open{transform:none}
.side nav a{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.side nav a .led{margin:0}
.side nav a[aria-current]{color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:2.4rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);background-image:var(--brush);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.25rem}
.vinyl{width:100%;aspect-ratio:1;max-width:170px;align-self:center;border-radius:50%;background:radial-gradient(circle,var(--lbl) 0 17%,#111 17.5% 19%,transparent 19.5%),repeating-radial-gradient(circle,#161616 0 2px,#0b0b0b 2px 4px);box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 0 0 2px #222;position:relative;transition:transform 1.2s}
.vinyl::after{content:"";position:absolute;inset:48.5%;border-radius:50%;background:var(--bg)}
.card:hover .vinyl{transform:rotate(200deg)}
.newcard{border-style:dashed;display:grid;place-items:center;min-height:260px;color:var(--muted);font-weight:700;background:none}
.cardbar{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:10px}

/* set page */
.back{display:inline-block;margin-bottom:10px;font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:700;color:var(--muted)}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
details.info summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}

.key{display:inline-block;min-width:42px;text-align:center;padding:2px 8px;border-radius:6px;background:#050505;border:1px solid #333;color:var(--teal);font-family:"Share Tech Mono",monospace;font-size:1rem;text-shadow:0 0 6px rgba(53,214,198,.6);cursor:pointer}
.bpm{font-family:"Share Tech Mono",monospace;color:var(--accent);text-shadow:0 0 6px rgba(167,123,255,.65);cursor:pointer;background:none;border:0;padding:0}
.led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
.led.green{background:var(--green);box-shadow:0 0 8px var(--green)}
.led.amber{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.led.acc{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.led.red{background:var(--red);box-shadow:0 0 8px var(--red)}
.led.off{background:#333}

ol.play{list-style:none;margin:0;padding:0}
.trk{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.trk .n{font-family:"Share Tech Mono",monospace;font-size:1.3rem;color:var(--muted);text-align:center}
.trk .t{font-weight:700} .trk .a{color:var(--muted);font-size:.9rem}
.trk .meta{display:flex;gap:12px;align-items:center}
.xfer{margin:6px 0 6px 36px;padding:10px 14px;border-left:2px dashed var(--line);font-size:.92rem}
.xfer b{font-weight:700}
.xfer .win{color:var(--muted)}

/* organize */
.org{display:grid;grid-template-columns:280px 1fr 320px;gap:18px;align-items:start}
@media (max-width:1000px){.org{grid-template-columns:1fr}}
.org h2{font-size:1.15rem;margin-bottom:6px}
.orow{display:grid;grid-template-columns:22px 1fr 72px 64px auto;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.orow.drag{opacity:.4} .orow.over{border-color:var(--accent)}
.orow .grip{cursor:grab;color:var(--muted);text-align:center;user-select:none}
.orow input{padding:4px 6px;font-family:"Share Tech Mono",monospace}
.orow .acts{display:flex;gap:2px}
.orow .acts button{background:none;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;padding:0}
.jump{font-size:.82rem;padding:4px 10px 4px 34px}
.jump.bad{color:var(--red)} .jump.ok{color:var(--muted)}
.tool + .tool{margin-top:16px}
.knobs{display:grid;gap:4px}
.sugg{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:4px}
.msg{font-size:.88rem;margin:8px 0 0}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.toggle{display:flex;gap:6px;flex-wrap:wrap}

/* popover */
#pop{position:absolute;z-index:40;width:290px;background:#111114;border:1px solid var(--accent);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:.92rem}
#pop h3{font-size:1.05rem;margin-bottom:6px}
#pop ul{margin:6px 0 0;padding-left:18px}

/* learn */
.learn{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:22px;align-items:start}
@media (max-width:820px){.learn{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tiles .panel h3{font-size:1.05rem;margin-bottom:6px}
svg text{font-family:"Share Tech Mono",monospace;font-size:11px;pointer-events:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="deck">
  <a class="brand" href="#/"><span class="dot" aria-hidden="true"></span>Springboard</a>
  <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span></span></button>
</header>
<div class="scrim" id="scrim" hidden></div>
<aside class="side" id="side" aria-label="Menu" inert>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="brand" style="font-size:1.2rem">Menu</span><button class="btn small" id="closeSide">Close</button></div>
  <nav>
    <a href="#/" data-nav="home"><span class="led acc"></span>My sets</a>
    <a href="#/learn" data-nav="learn"><span class="led acc"></span>Learn: keys &amp; BPM</a>
    <a href="#/about" data-nav="about"><span class="led acc"></span>About</a>
  </nav>
</aside>
<main id="main"></main>
<div id="pop" hidden role="dialog"></div>

<script>
// ---------- data helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const track=(e,p)=>{try{window.posthog&&posthog.capture&&posthog.capture(e,p||{})}catch(x){}};
const MUSICAL={"1A":"A♭ minor","1B":"B major","2A":"E♭ minor","2B":"F♯ major","3A":"B♭ minor","3B":"D♭ major","4A":"F minor","4B":"A♭ major","5A":"C minor","5B":"E♭ major","6A":"G minor","6B":"B♭ major","7A":"D minor","7B":"F major","8A":"A minor","8B":"C major","9A":"E minor","9B":"G major","10A":"B minor","10B":"D major","11A":"F♯ minor","11B":"A major","12A":"D♭ minor","12B":"E major"};
const NOTE={c:0,"c#":1,db:1,d:2,"d#":3,eb:3,e:4,f:5,"f#":6,gb:6,g:7,"g#":8,ab:8,a:9,"a#":10,bb:10,b:11};
const MINOR_NUM=[5,12,7,2,9,4,11,6,1,8,3,10], MAJOR_NUM=[8,3,10,5,12,7,2,9,4,11,6,1];
function parseKey(k){
  k=String(k||"").trim();
  let m=/^(1[0-2]|[1-9])\s*([ab])$/i.exec(k); if(m) return m[1]+m[2].toUpperCase();
  m=/^([a-g])\s*([#♯b♭]?)\s*(m|min|minor|maj|major)?$/i.exec(k.replace(/\s+/g," ")); if(!m) return null;
  const n=NOTE[(m[1]+(m[2]||"").replace("♯","#").replace("♭","b")).toLowerCase()]; if(n===undefined) return null;
  const minor=/^m(in(or)?)?$/i.test(m[3]||"");
  return minor?MINOR_NUM[n]+"A":MAJOR_NUM[n]+"B";
}
const kn=k=>({n:+k.slice(0,-1),l:k.slice(-1)});
function keyMove(a,b){
  const A=kn(a),B=kn(b),up=(B.n-A.n+12)%12;
  if(A.l===B.l){
    if(up===0) return {s:1,type:"same",label:"Same key"};
    if(up===1) return {s:.9,type:"step",label:"One step up",dir:"lifts the mood"};
    if(up===11) return {s:.9,type:"step",label:"One step down",dir:"relaxes the mood"};
    if(up===2) return {s:.6,type:"boost",label:"Energy boost (+2)"};
    if(up===7) return {s:.55,type:"boost",label:"Energy boost (+7)"};
  } else {
    if(up===0) return {s:.8,type:"mood",label:A.l==="A"?"Mood shift, minor → major":"Mood shift, major → minor"};
    if(up===1||up===11) return {s:.5,type:"diag",label:"Diagonal move"};
  }
  return {s:.1,type:"clash",label:"Key clash"};
}
const RULES={strict:{min:.8,name:"Strict Camelot"},boost:{min:.5,name:"Allow energy jumps"},loose:{min:0,name:"Anything goes"}};
const bpmPct=(a,b)=>Math.abs(b-a)/a*100;
const mixWin=(bpm,bars)=>Math.round(bars*4*60/bpm);
function transition(p,n,rule){
  const k=keyMove(p.key,n.key), pct=bpmPct(p.bpm,n.bpm), keyOk=k.s>=RULES[rule||"strict"].min, tempoOk=pct<=6;
  let led=keyOk&&tempoOk?"green":(k.s>=.5&&pct<=8)?"amber":"red", tip, bars;
  if(!tempoOk){ tip=`Tempo gap of ${pct.toFixed(1)}% is too big to blend. Loop the outro, then echo out or cut on the last beat of a phrase.`; bars=8; }
  else if(k.type==="same"){ tip="Long blend: overlap the tracks and swap the bass on a downbeat."; bars=32; }
  else if(k.type==="step"){ tip=`Smooth blend; this ${k.dir}. Bring the new track in on a phrase and trade the bass halfway.`; bars=32; }
  else if(k.type==="mood"){ tip="EQ swap: cut the lows on the outgoing track and bring the new one in on a new phrase."; bars=16; }
  else if(k.type==="boost"){ tip="Short, punchy mix on the drop for a lift. Don’t overlap the melodies for long."; bars=16; }
  else if(k.type==="diag"){ tip="Works in a short blend. Keep the overlap brief and lean on drums."; bars=8; }
  else { tip="Keys clash. Avoid overlapping melodies: echo out, use a drum break, or cut."; bars=4; }
  return {k,pct,led,keyOk,tempoOk,tip,bars,secs:mixWin(p.bpm,bars)};
}
const hueOf=k=>k?`hsl(${(kn(k).n-1)*30} ${kn(k).l==="A"?"70%":"80%"} ${kn(k).l==="A"?"45%":"62%"})`:"#555";

// ---------- storage
const STORE="springboard.sets.v1";
function demo(){
  const t=(title,artist,bpm,key,genre,energy)=>({id:uid(),title,artist,bpm,key,genre,energy});
  return [{id:uid(),title:"Rooftop Warm-up",venue:"Sample set",date:"",vibe:"Sunset disco into house",notes:"Made-up demo tracks. Paste your own songs in Organize set.",shape:{rule:"strict",curve:"build",genre:"blend"},
    tracks:[t("Night Shift","Velvet Arcade",120,"8A","disco",2),t("Low Tide","Mara Quill",121,"8B","disco",3),t("Glass Hours","Northline",122,"9B","house",3),t("Soft Machine","Rhea Lune",123,"9A","house",3),t("Overpass","Halden",124,"10A","house",4),t("Silver Thread","Kite & Copper",125,"10B","house",4),t("Runway Lights","Sol Vega",126,"12B","house",5)]}];
}
let sets; try{ sets=JSON.parse(localStorage.getItem(STORE))||demo(); }catch(e){ sets=demo(); }
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(sets))}catch(e){}};
const getSet=id=>sets.find(s=>s.id===id);

// ---------- AI (only when running through server.py)
let aiOK=false, aiWhy="Open the app at http://localhost:8000/app/ with python3 server.py running in Terminal to use AI.";
fetch("/api/health").then(r=>{aiOK=r.ok; if(!r.ok) aiWhy="The server is running, but no OpenRouter key was found. Put your key in the .env file, then stop (Ctrl+C) and restart python3 server.py."; route();}).catch(()=>{});
async function ai(prompt,image){
  const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,image})});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||"AI request failed");
  return Array.isArray(d.result)?d.result:[];
}
const cleanSong=x=>{const key=parseKey(x.camelot||x.key), bpm=Math.round(+x.bpm);
  return (x.title&&x.artist&&key&&bpm>=50&&bpm<=200)?{id:uid(),title:String(x.title).trim(),artist:String(x.artist).trim(),bpm,key,genre:String(x.genre||"").toLowerCase().trim(),energy:Math.min(5,Math.max(1,Math.round(+x.energy)||3)),why:String(x.why||"")}:null;};
const SONG_SCHEMA=`{"title": string, "artist": string, "bpm": number, "camelot": string like "8A", "genre": short lowercase genre, "energy": integer 1-5}`;

// ---------- menu
function setMenu(open){
  $("#side").classList.toggle("open",open); $("#scrim").hidden=!open; $("#burger").setAttribute("aria-expanded",open);
  if(open){ $("#side").removeAttribute("inert"); $("#closeSide").focus(); } else { $("#side").setAttribute("inert",""); }
}
$("#burger").onclick=()=>setMenu(true); $("#closeSide").onclick=()=>{setMenu(false);$("#burger").focus();}; $("#scrim").onclick=()=>setMenu(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ setMenu(false); hidePop(); }});

// ---------- popovers (key / bpm help)
function hidePop(){ $("#pop").hidden=true; }
function showPop(el,html){
  const p=$("#pop"); p.innerHTML=html+`<p style="margin:10px 0 0"><a href="#/learn">Full guide →</a></p>`; p.hidden=false;
  const r=el.getBoundingClientRect(); let x=r.left+scrollX, y=r.bottom+scrollY+8;
  x=Math.min(x,scrollX+document.documentElement.clientWidth-p.offsetWidth-12); p.style.left=Math.max(12,x)+"px"; p.style.top=y+"px";
}
function keyHelp(k){
  const safe=Object.keys(MUSICAL).filter(x=>x!==k&&keyMove(k,x).s>=.8), boost=Object.keys(MUSICAL).filter(x=>{const m=keyMove(k,x);return m.s>=.5&&m.s<.8;});
  return `<h3><span class="key">${k}</span> ${MUSICAL[k]}</h3><p class="muted" style="margin:0">Camelot puts the 24 keys on a clock. Numbers are positions, A is minor, B is major. Neighbors mix in harmony.</p>
  <ul><li><b>Smooth from here:</b> ${safe.map(x=>`<span class="lcd">${x}</span>`).join(", ")} (same number swaps the mood)</li><li><b>Energy jump:</b> ${boost.map(x=>`<span class="lcd">${x}</span>`).join(", ")}</li><li><b>Anything else</b> may clash in a long blend.</li></ul>`;
}
function bpmHelp(b){ return `<h3><span class="lcd" style="color:var(--accent)">${b} BPM</span></h3><p style="margin:0">Beats per minute. Tracks within <b>±6%</b> (about ${Math.round(b*.94)}–${Math.round(b*1.06)} BPM) can be beatmatched for a long blend. Bigger jumps need a cut, loop or echo-out. Half or double time (${Math.round(b/2)} or ${b*2}) also works.</p><p class="muted" style="margin:6px 0 0">32 bars at this tempo ≈ ${mixWin(b,32)} seconds.</p>`; }
document.addEventListener("click",e=>{
  const k=e.target.closest("[data-keyhelp]"), b=e.target.closest("[data-bpmhelp]");
  if(k){ showPop(k,keyHelp(k.dataset.keyhelp)); e.stopPropagation(); return; }
  if(b){ showPop(b,bpmHelp(+b.dataset.bpmhelp)); e.stopPropagation(); return; }
  if(!e.target.closest("#pop")) hidePop();
});
const keyBtn=k=>`<button class="key" data-keyhelp="${k}" aria-label="Key ${k}, ${MUSICAL[k]}. Show key help">${k}</button>`;
const bpmBtn=b=>`<button class="bpm" data-bpmhelp="${b}" aria-label="${b} BPM. Show tempo help">${b} BPM</button>`;

// ---------- router
window.addEventListener("hashchange",route);
function route(){
  hidePop(); setMenu(false);
  const h=location.hash.replace(/^#\/?/,"").split("/");
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===(h[0]||"home")||(h[0]==="set"&&a.dataset.nav==="home")));
  if(h[0]==="set"&&getSet(h[1])) return setPage(getSet(h[1]),h[2]==="organize"?"organize":"play");
  if(h[0]==="learn") return learnPage();
  if(h[0]==="about") return aboutPage();
  homePage();
}

// ---------- home
function homePage(){
  $("#main").innerHTML=`<div class="hero"><div><h1>Your sets</h1><p class="muted" style="margin:4px 0 0">Pick a set to play, or start a new one.</p></div></div>
  <div class="grid">${sets.map(s=>`<article class="card">
    <button class="open" data-open="${s.id}" aria-label="Open ${esc(s.title)}">
      <div class="vinyl" style="--lbl:${hueOf(s.tracks[0]&&s.tracks[0].key)}" aria-hidden="true"></div>
      <h3>${esc(s.title||"Untitled set")}</h3>
      <span class="muted">${[s.venue,s.date].filter(Boolean).map(esc).join(" · ")||"Add a venue and date"}</span>
      ${s.vibe?`<span>${esc(s.vibe)}</span>`:""}
      <span class="lcd muted">${s.tracks.length} TRACK${s.tracks.length===1?"":"S"}</span>
    </button>
    <div class="cardbar"><button class="link" data-dup="${s.id}">Duplicate</button><button class="link" data-del="${s.id}">Delete</button></div>
  </article>`).join("")}
  <button class="card newcard" id="newSet">+ New set</button></div>`;
  $("#main").onclick=e=>{
    const o=e.target.closest("[data-open]"), d=e.target.closest("[data-dup]"), x=e.target.closest("[data-del]");
    if(o) location.hash=`#/set/${o.dataset.open}/play`;
    else if(d){ const s=getSet(d.dataset.dup); sets.push({...JSON.parse(JSON.stringify(s)),id:uid(),title:s.title+" (copy)"}); save(); homePage(); }
    else if(x){ const s=getSet(x.dataset.del); if(confirm(`Delete "${s.title}"?`)){ sets=sets.filter(y=>y!==s); save(); homePage(); } }
    else if(e.target.id==="newSet"){ const s={id:uid(),title:"New set",venue:"",date:"",vibe:"",notes:"",shape:{rule:"strict",curve:"build",genre:"blend"},tracks:[]}; sets.push(s); save(); track("set_created"); location.hash=`#/set/${s.id}/organize`; }
  };
}

// ---------- set page
function setPage(s,tab){
  $("#main").innerHTML=`<a class="back" href="#/">← All sets</a>
  <div class="hero" style="margin:0"><div><h1 id="setTitle">${esc(s.title||"Untitled set")}</h1><p class="muted" style="margin:4px 0 0">${[s.venue,s.date,s.vibe].filter(Boolean).map(esc).join(" · ")}</p></div></div>
  <details class="info" ${s.title==="New set"?"open":""}><summary>Edit set info</summary>
    <div class="infogrid"><div><label for="fTitle">Title</label><input id="fTitle" data-f="title" value="${esc(s.title)}"></div>
    <div><label for="fVenue">Venue or occasion</label><input id="fVenue" data-f="venue" value="${esc(s.venue)}"></div>
    <div><label for="fDate">Date</label><input id="fDate" type="date" data-f="date" value="${esc(s.date)}"></div>
    <div><label for="fVibe">Vibe</label><input id="fVibe" data-f="vibe" value="${esc(s.vibe)}" placeholder="e.g. sunset disco into house"></div></div>
    <label for="fNotes">Notes</label><textarea id="fNotes" data-f="notes" style="min-height:60px">${esc(s.notes)}</textarea>
  </details>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${tab==="play"}" data-tab="play">Your set</button><button class="tab" role="tab" aria-selected="${tab==="organize"}" data-tab="organize">Organize set</button></div>
  <div id="tabBody"></div>`;
  document.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{ s[i.dataset.f]=i.value; save(); if(i.dataset.f==="title") $("#setTitle").textContent=i.value||"Untitled set"; });
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>location.hash=`#/set/${s.id}/${b.dataset.tab}`);
  tab==="play"?playTab(s):organizeTab(s);
}

function playTab(s){
  track("set_viewed",{tracks:s.tracks.length});
  const T=s.tracks;
  if(!T.length){ $("#tabBody").innerHTML=`<div class="panel empty">This set is empty. <a href="#/set/${s.id}/organize">Add songs in Organize set →</a></div>`; return; }
  const xs=T.slice(1).map((t,i)=>transition(T[i],t,s.shape.rule)), smooth=xs.filter(x=>x.led==="green").length;
  $("#tabBody").innerHTML=`<p class="note">${T.length} tracks · ${smooth} of ${xs.length} transitions mix smoothly. Tap a key or BPM for help.</p><ol class="play">${T.map((t,i)=>{
    const x=i>0?xs[i-1]:null;
    return (x?`<li class="xfer"><span class="led ${x.led}"></span><b>${x.led==="green"?"Smooth":x.led==="amber"?"Careful":"Risky"}: ${esc(x.k.label)}${x.tempoOk?"":", big tempo jump"}.</b> ${esc(x.tip)}<br><span class="win">Start mixing out of “${esc(T[i-1].title)}” about ${x.bars} bars (≈${x.secs}s) before its end, bringing “${esc(t.title)}” in on the first beat of its phrase.</span></li>`:"")+
    `<li class="trk"><span class="n">${String(i+1).padStart(2,"0")}</span><span><span class="t">${esc(t.title)}</span><br><span class="a">${esc(t.artist)}${t.genre?" · "+esc(t.genre):""}</span></span><span class="meta">${bpmBtn(t.bpm)}${keyBtn(t.key)}</span></li>`; }).join("")}</ol>`;
}

function organizeTab(s){
  const sh=s.shape;
  $("#tabBody").innerHTML=`<div class="org">
  <section class="panel"><h2>Add songs</h2>
    <label for="paste">Paste a list</label>
    <textarea id="paste" placeholder="Title - Artist&#10;Title - Artist, 124, 8A, house"></textarea>
    <p class="note">One song per line. BPM, key and genre are optional${aiOK?"; the AI fills in what’s missing.":". Without the local server, include BPM and key."}</p>
    <button class="btn primary" id="addPaste">Add songs</button>
    <label for="shot">Or upload a playlist screenshot</label>
    <input type="file" id="shot" accept="image/*" ${aiOK?"":"disabled"}>
    ${aiOK?"":`<p class="note">${esc(aiWhy)}</p>`}
    <p class="msg" id="addMsg" aria-live="polite"></p>
  </section>
  <section><div class="panel"><h2>Set order</h2><p class="note">Drag the ≡ handle or use the arrows. Edit BPM and key right in the row; tap a glowing key or BPM for help.</p><div id="order"></div></div></section>
  <section>
    <div class="panel tool"><h2>Shape the set</h2><div class="knobs">
      <label for="rule">Key rule</label><select id="rule">${Object.entries(RULES).map(([k,v])=>`<option value="${k}" ${sh.rule===k?"selected":""}>${v.name}</option>`).join("")}</select>
      <label for="curve">Energy curve</label><select id="curve"><option value="build" ${sh.curve==="build"?"selected":""}>Build up</option><option value="steady" ${sh.curve==="steady"?"selected":""}>Keep it steady</option><option value="wave" ${sh.curve==="wave"?"selected":""}>Peaks and dips</option></select>
      <label for="genreMode">Genre</label><select id="genreMode"><option value="close" ${sh.genre==="close"?"selected":""}>Stay close</option><option value="blend" ${sh.genre==="blend"?"selected":""}>Blend across genres</option></select>
    </div><button class="btn" id="autoOrder" style="margin-top:12px;width:100%">Auto-order my set</button><p class="note">Keeps your first track as the opener.</p></div>
    <div class="panel tool"><h2>AI next song</h2>
      <label for="after">Suggest songs after</label><select id="after">${s.tracks.map((t,i)=>`<option value="${i}" ${i===s.tracks.length-1?"selected":""}>${i+1}. ${esc(t.title)}</option>`).join("")}</select>
      <button class="btn primary" id="suggest" style="margin-top:10px;width:100%" ${aiOK&&s.tracks.length?"":"disabled"}>Suggest songs</button>
      <p class="note">${aiOK?"Matches key, BPM, genre and your shape settings. Results are estimates; check them in your DJ software.":esc(aiWhy)}</p>
      <div id="suggOut" aria-live="polite"></div></div>
  </section></div>`;
  drawOrder(s);

  ["rule","curve"].forEach(id=>$("#"+id).onchange=e=>{ sh[id]=e.target.value; save(); drawOrder(s); });
  $("#genreMode").onchange=e=>{ sh.genre=e.target.value; save(); };
  $("#autoOrder").onclick=()=>{ autoOrder(s); save(); track("set_auto_ordered"); organizeTab(s); };
  $("#addPaste").onclick=()=>addFromPaste(s);
  $("#shot").onchange=e=>addFromShot(s,e.target.files[0]);
  $("#suggest").onclick=()=>suggest(s);
}

function drawOrder(s){
  const T=s.tracks, box=$("#order");
  if(!T.length){ box.innerHTML=`<p class="empty">No songs yet. Add some on the left.</p>`; return; }
  box.innerHTML=T.map((t,i)=>{
    let j="";
    if(i>0){ const x=transition(T[i-1],t,s.shape.rule), why=[];
      if(!x.keyOk) why.push(`key jump ${T[i-1].key} → ${t.key}`); if(!x.tempoOk) why.push(`${x.pct.toFixed(1)}% BPM jump`);
      j=why.length?`<div class="jump bad"><span class="led red"></span>Too big a ${why.join(" and ")}</div>`:`<div class="jump ok"><span class="led green"></span>${esc(x.k.label)}, mixes smoothly</div>`; }
    return j+`<div class="orow" draggable="true" data-i="${i}"><span class="grip" aria-hidden="true">≡</span>
      <span><b>${esc(t.title)}</b><br><span class="note">${esc(t.artist)}${t.genre?" · "+esc(t.genre):""}</span> ${keyBtn(t.key)} ${bpmBtn(t.bpm)}</span>
      <input aria-label="BPM for ${esc(t.title)}" type="number" min="50" max="200" value="${t.bpm}" data-bpm="${i}">
      <input aria-label="Key for ${esc(t.title)}" value="${t.key}" data-key="${i}">
      <span class="acts"><button aria-label="Move up" data-mv="${i}" data-d="-1">↑</button><button aria-label="Move down" data-mv="${i}" data-d="1">↓</button><button aria-label="Remove ${esc(t.title)}" data-rm="${i}">✕</button></span></div>`;
  }).join("");
  const move=(from,to)=>{ if(to<0||to>=T.length||from===to) return; T.splice(to,0,T.splice(from,1)[0]); save(); track("set_reordered"); drawOrder(s); refreshAfter(s); };
  box.onclick=e=>{ const m=e.target.closest("[data-mv]"), r=e.target.closest("[data-rm]");
    if(m) move(+m.dataset.mv,+m.dataset.mv+ +m.dataset.d);
    if(r){ T.splice(+r.dataset.rm,1); save(); drawOrder(s); refreshAfter(s); } };
  box.onchange=e=>{ const b=e.target.dataset.bpm, k=e.target.dataset.key;
    if(b!==undefined){ const v=Math.round(+e.target.value); if(v>=50&&v<=200){ T[b].bpm=v; save(); drawOrder(s);} }
    if(k!==undefined){ const v=parseKey(e.target.value); if(v){ T[k].key=v; save(); drawOrder(s);} else e.target.value=T[k].key; } };
  let dragFrom=null;
  box.ondragstart=e=>{ const r=e.target.closest(".orow"); if(!r) return; dragFrom=+r.dataset.i; r.classList.add("drag"); e.dataTransfer.effectAllowed="move"; };
  box.ondragover=e=>{ const r=e.target.closest(".orow"); if(!r) return; e.preventDefault(); box.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); r.classList.add("over"); };
  box.ondrop=e=>{ const r=e.target.closest(".orow"); if(!r||dragFrom===null) return; e.preventDefault(); move(dragFrom,+r.dataset.i); dragFrom=null; };
  box.ondragend=()=>{ dragFrom=null; box.querySelectorAll(".drag,.over").forEach(x=>x.classList.remove("drag","over")); };
}
function refreshAfter(s){ const a=$("#after"); if(!a) return; a.innerHTML=s.tracks.map((t,i)=>`<option value="${i}" ${i===s.tracks.length-1?"selected":""}>${i+1}. ${esc(t.title)}</option>`).join(""); $("#suggest").disabled=!(aiOK&&s.tracks.length); }

function energyTarget(curve,pos,n){ if(curve==="steady") return 3; if(curve==="wave") return [2,3,4,5,4,3][pos%6]; return 2+3*pos/Math.max(1,n-1); }
function autoOrder(s){
  const T=s.tracks; if(T.length<3) return; const rule=RULES[s.shape.rule].min, out=[T[0]], left=T.slice(1);
  while(left.length){ const p=out[out.length-1], pos=out.length;
    const score=t=>{ const k=keyMove(p.key,t.key).s, pct=bpmPct(p.bpm,t.bpm);
      return (k>=rule?2:0)+k-(pct/6)*.6+(s.shape.genre==="close"&&t.genre&&t.genre===p.genre?.4:0)-Math.abs((t.energy||3)-energyTarget(s.shape.curve,pos,T.length))*.15; };
    left.sort((a,b)=>score(b)-score(a)); out.push(left.shift()); }
  s.tracks=out;
}

// ---------- adding songs
function msg(t,kind){ const m=$("#addMsg"); m.textContent=t; m.className="msg "+(kind||""); }
async function addFromPaste(s){
  const lines=$("#paste").value.split("\n").map(x=>x.trim()).filter(Boolean); if(!lines.length) return msg("Paste at least one song.","err");
  const done=[], need=[];
  lines.forEach(l=>{ const m=/^(.+?)\s+[-–]\s+([^,]+?)(?:\s*,\s*(\d+(?:\.\d+)?))?(?:\s*,\s*([^,]+?))?(?:\s*,\s*(.+))?$/.exec(l);
    if(!m) return need.push(l); const bpm=m[3]?Math.round(+m[3]):0, key=parseKey(m[4]);
    if(bpm>=50&&bpm<=200&&key) done.push({id:uid(),title:m[1].trim(),artist:m[2].trim(),bpm,key,genre:(m[5]||"").toLowerCase().trim(),energy:3}); else need.push(l); });
  let extra=[];
  if(need.length){
    if(!aiOK){ s.tracks.push(...done); save(); drawOrder(s); refreshAfter(s); return msg(`Added ${done.length}. ${need.length} line(s) need BPM and key, like “Title - Artist, 124, 8A”.`,"err"); }
    msg("Asking the AI for BPM, key and genre…");
    try{ extra=(await ai(`A DJ pasted these songs (one per line, usually "Title - Artist"):\n${need.join("\n")}\nFor each real song, give your best estimate of its BPM, Camelot key, genre and energy. Skip lines that aren't songs. Reply with only a JSON array; each item: ${SONG_SCHEMA}.`)).map(cleanSong).filter(Boolean); }
    catch(e){ return msg("Couldn’t reach the AI: "+e.message,"err"); }
  }
  const all=done.concat(extra); s.tracks.push(...all); save(); $("#paste").value=""; drawOrder(s); refreshAfter(s);
  track("songs_added",{count:all.length,via:"paste",ai:extra.length});
  msg(`Added ${all.length} song${all.length===1?"":"s"}.${extra.length?" AI values are estimates, so check BPM and key and fix them in the rows.":""}`,"ok");
}
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const sc=Math.min(1,1400/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=img.width*sc; c.height=img.height*sc; c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.85)); };
  img.onerror=rej; img.src=url; }); }
async function addFromShot(s,file){
  if(!file) return; msg("Reading your screenshot…");
  try{ const img=await shrink(file);
    const list=(await ai(`This is a screenshot of a music playlist. List every song you can read in it, top to bottom. For each, give the title, artist, and your best estimate of BPM, Camelot key, genre and energy. Reply with only a JSON array; each item: ${SONG_SCHEMA}.`,img)).map(cleanSong).filter(Boolean);
    s.tracks.push(...list); save(); drawOrder(s); refreshAfter(s); track("songs_added",{count:list.length,via:"screenshot"});
    msg(list.length?`Added ${list.length} songs from the screenshot. Check the AI’s BPM and key estimates.`:"Couldn’t read any songs. Try a clearer or closer screenshot.",list.length?"ok":"err");
  }catch(e){ msg("Couldn’t read the screenshot: "+e.message,"err"); }
  $("#shot").value="";
}

// ---------- AI next song
async function suggest(s){
  const i=+$("#after").value, t=s.tracks[i]; if(!t) return;
  const out=$("#suggOut"), btn=$("#suggest"), min=RULES[s.shape.rule].min;
  const keys=Object.keys(MUSICAL).filter(k=>keyMove(t.key,k).s>=Math.max(min,.5));
  const genres=[...new Set(s.tracks.map(x=>x.genre).filter(Boolean))], target=Math.round(energyTarget(s.shape.curve,i+1,Math.max(s.tracks.length,i+2)));
  btn.disabled=true; btn.textContent="Thinking…"; out.innerHTML=`<p class="note">This can take up to a minute.</p>`;
  track("ai_suggest_clicked");
  try{
    const have=new Set(s.tracks.map(x=>(x.title+"|"+x.artist).toLowerCase()));
    const list=(await ai(`You help a DJ pick the next song. Current track: "${t.title}" by ${t.artist}, ${t.bpm} BPM, Camelot ${t.key}, genre ${t.genre||"unknown"}, energy ${t.energy||3}/5.
Suggest up to 6 real, released songs with Camelot key in [${keys.join(", ")}], tempo ${Math.round(t.bpm*.94)}-${Math.round(t.bpm*1.06)} BPM, energy around ${target}/5.
${s.shape.genre==="close"?`Stay within these genres: ${genres.join(", ")||t.genre||"the same genre"}.`:`Related genres are welcome; the set so far includes ${genres.join(", ")||"various"}.`}
Do not suggest any of: ${[...have].join("; ")}. Only include songs whose key and tempo you know well.
Reply with only a JSON array; each item: ${SONG_SCHEMA.slice(0,-1)}, "why": one short sentence on why it fits}.`)).map(cleanSong).filter(x=>x&&!have.has((x.title+"|"+x.artist).toLowerCase()));
    track("ai_tracks_found",{count:list.length});
    out.innerHTML=list.length?list.map((x,n)=>`<div class="sugg"><span><b>${esc(x.title)}</b> · ${esc(x.artist)}</span><span>${bpmBtn(x.bpm)} ${keyBtn(x.key)} <span class="note">${esc(x.genre)}</span></span><span class="note">${esc(x.why)}</span><button class="btn small" data-addsugg="${n}">Add after #${i+1}</button></div>`).join(""):`<p class="note">No confident matches. Try “Allow energy jumps” or “Blend across genres.”</p>`;
    out.onclick=e=>{ const b=e.target.closest("[data-addsugg]"); if(!b) return; s.tracks.splice(i+1,0,list[+b.dataset.addsugg]); save(); track("ai_song_added"); b.replaceWith(Object.assign(document.createElement("span"),{className:"note",textContent:"Added ✓"})); drawOrder(s); refreshAfter(s); };
  }catch(e){ out.innerHTML=`<p class="msg err">Couldn’t reach the AI: ${esc(e.message)}</p>`; }
  btn.disabled=false; btn.textContent="Suggest songs";
}

// ---------- learn
function wheel(){
  let g=""; [["B",118,"#efe8db"],["A",78,"#a39c90"]].forEach(([l,r])=>{ for(let n=1;n<=12;n++){ const a=((n-1)*30-90)*Math.PI/180, x=150+r*Math.cos(a), y=150+r*Math.sin(a), k=n+l;
    g+=`<g data-keyhelp="${k}" style="cursor:pointer" role="button" tabindex="0" aria-label="${k}, ${MUSICAL[k]}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18" fill="${hueOf(k)}" stroke="#000" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" fill="#000">${k}</text></g>`; }});
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Camelot wheel. Tap a key for details."><circle cx="150" cy="150" r="145" fill="#0d0d0f" stroke="#2b2b32"/>${g}<circle cx="150" cy="150" r="44" fill="#111" stroke="#2b2b32"/><text x="150" y="146" text-anchor="middle" fill="#a77bff">CAMELOT</text><text x="150" y="162" text-anchor="middle" fill="#a39c90">A inner · B outer</text></svg>`;
}
function learnPage(){
  $("#main").innerHTML=`<div class="hero"><div><h1>Keys &amp; BPM</h1><p class="muted" style="margin:4px 0 0">Tap any key on the wheel to see where it can go.</p></div></div>
  <div class="learn"><div class="panel">${wheel()}</div><div class="tiles">
    <div class="panel"><h3><span class="led green"></span>Same key</h3><p>8A → 8A. The smoothest blend; overlap as long as you like.</p></div>
    <div class="panel"><h3><span class="led green"></span>One step</h3><p>8A → 9A lifts the mood; 8A → 7A relaxes it. Safe for long blends.</p></div>
    <div class="panel"><h3><span class="led green"></span>Mood shift</h3><p>8A ↔ 8B. Same notes, minor ↔ major. Great for changing the feel; try an EQ swap.</p></div>
    <div class="panel"><h3><span class="led amber"></span>Energy jump</h3><p>+2 (8A → 10A) or +7 (8A → 3A). A noticeable lift; keep the blend short, on a drop.</p></div>
    <div class="panel"><h3><span class="led red"></span>Clash</h3><p>Anything else. Melodies may fight, so cut, echo out, or use a drum break.</p></div>
    <div class="panel"><h3><span class="led amber"></span>BPM &amp; blending</h3><p>Within ±6% you can beatmatch. 32 bars ≈ 60 s at 128 BPM. Bigger gaps: loop, cut, or echo out.</p></div>
  </div></div>`;
  $("#main").onkeydown=e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.dataset.keyhelp){ e.preventDefault(); showPop(e.target,keyHelp(e.target.dataset.keyhelp)); } };
}
function aboutPage(){
  $("#main").innerHTML=`<div class="hero"><h1>About Springboard</h1></div><div class="panel" style="max-width:640px"><p>Springboard helps DJs build sets that flow. It checks every transition by Camelot key and BPM, explains how to mix it, and suggests real songs to play next.</p><p>Built for NYU Stern’s <i>Building with AI</i>. Read the <a href="../">product page and build log</a>.</p><p class="note">BPM and key values from the AI are estimates. Always check them in your DJ software.</p></div>`;
}
route();
</script>
